<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/aso.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#04060d" />
    <meta name="description" content="Concepto AEIS — casilleros, eventos, recursos, comunidad y seguridad." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Warm the tile host's DNS/TLS while the app boots, so the map isn't
         paying for a cold connection the moment someone opens Seguridad. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />
    <!-- El style JSON está auto-alojado en Vercel CDN. preload lo pide en
         paralelo con el bundle JS para que MapLibre lo encuentre ya listo. -->
    <!-- El estilo del mapa (20 KB) YA NO se precarga acá.
         Lo pedía en CADA carga de página, incluida la de login, donde el
         mapa es inalcanzable — Seguridad vive detrás de la sesión. Y desde
         que MapLibre solo se carga con sesión iniciada (ver App.svelte),
         este preload además llegaba "sin usarse a tiempo", que es
         exactamente lo que el navegador advierte como preload desperdiciado.
         mapWarm.ts lo pide solo cuando de verdad crea el mapa. -->

    <!-- Loaded non-render-blocking: on a slow connection the Google Fonts
         stylesheet used to gate first paint behind two extra round trips.
         Swapping media to `all` on load lets the shell paint immediately in
         the fallback face, then upgrade to Doto when it arrives. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Doto:wght@400;500;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Doto:wght@400;500;700;800&display=swap"
      />
    </noscript>

    <title>AEIS · Casilleros</title>

    <!-- Inline so there is something on screen the instant the HTML lands,
         instead of a white page until the JS bundle downloads and mounts. -->
    <style>
      html,
      body {
        margin: 0;
        background: #04060d;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: radial-gradient(120% 90% at 50% 40%, #0d1838 0%, #070c1c 55%, #04060d 100%);
        font-family: "Atkinson Hyperlegible", "Doto", ui-monospace, "Segoe UI", sans-serif;
        color: #eef4fb;
        z-index: 100;
      }
      #boot img {
        width: 84px;
        height: 84px;
        object-fit: contain;
        filter: drop-shadow(0 0 18px rgba(33, 224, 160, 0.45));
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      #boot .t {
        /* Mismo stack que --font-heading en app.css (Anton primero) — el
           resto de la app usa esa fuente para "AEIS" (brandbar, Login), y
           el splash usaba "Doto" acá, una fuente que en el resto de la app
           solo aparece como fallback dentro de --font-display, nunca como
           título. Sin este ajuste, lo primero que ve el estudiante rompía
           el principio de Gestalt de semejanza tipográfica con el resto. */
        font-family: "Anton", "Atkinson Hyperlegible", "Segoe UI", sans-serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.4em;
        text-shadow: 0 0 24px rgba(33, 224, 160, 0.45);
      }
      #boot .s {
        font-size: 11px;
        letter-spacing: 0.08em;
        color: #9db0d1;
        text-align: center;
        max-width: 260px;
        margin-top: -8px;
      }
      #boot .log {
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 10.5px;
        letter-spacing: 0.01em;
        color: #21e0a0;
        min-height: 54px;
        width: 230px;
        text-align: left;
      }
      #boot .log div {
        opacity: 0.85;
        white-space: pre;
      }
      #boot .log .cursor {
        display: inline-block;
        width: 6px;
        height: 11px;
        background: #21e0a0;
        margin-left: 2px;
        vertical-align: -1px;
        animation: boot-blink 0.9s step-end infinite;
      }
      @keyframes boot-blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }
      #boot .bar {
        width: 120px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        margin-top: 10px;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: #21e0a0;
        box-shadow: 0 0 10px rgba(33, 224, 160, 0.45);
        animation: boot-load 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }
      @keyframes boot-load {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(360%);
        }
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="boot">
      <img src="/aso.png" alt="" fetchpriority="high" />
      <div class="t">AEIS</div>
      <div class="s">Asociación de Estudiantes de Ingeniería de Sistemas</div>
      <div class="log" id="bootLog" aria-hidden="true"></div>
      <div class="bar"><i></i></div>
    </div>

    <!-- Vanilla, no-framework: corre ANTES de que el bundle de Svelte
         siquiera empiece a descargar, así que no puede depender de
         TypeText.svelte (que todavía no existe en esta pantalla). Mismo
         efecto de "escribirse solo" que el resto de la app, pero
         implementado a mano para esta única pantalla que vive fuera del
         árbol de componentes. -->
    <script>
      (function () {
        var lines = ["iniciando sistema AEIS…", "verificando sesión…", "cargando interfaz…"];
        var el = document.getElementById("bootLog");
        if (!el) return;
        var lineIndex = 0;
        var charIndex = 0;
        var lineEl = null;

        function renderLine(text, showCursor) {
          lineEl.textContent = "> " + text;
          if (showCursor) {
            var cursor = document.createElement("span");
            cursor.className = "cursor";
            lineEl.appendChild(cursor);
          }
        }

        function tick() {
          if (lineIndex >= lines.length) return;
          if (!lineEl) {
            lineEl = document.createElement("div");
            el.appendChild(lineEl);
          }
          var line = lines[lineIndex];
          if (charIndex < line.length) {
            charIndex++;
            renderLine(line.slice(0, charIndex), true);
            setTimeout(tick, 11);
          } else {
            renderLine(line, false);
            lineIndex++;
            charIndex = 0;
            lineEl = null;
            setTimeout(tick, 90);
          }
        }
        tick();
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
