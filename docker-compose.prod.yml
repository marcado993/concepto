# Despliegue en la instancia (Oracle Cloud Always Free, VM.Standard.A1.Flex
# 2 OCPU/12GB, Oracle Linux 9 — ver docs/dominio/10-despliegue-vps-vercel.md
# para la guía completa paso a paso). Diferencias clave contra
# docker-compose.yml (desarrollo):
#
#   - backend usa el target "runtime" del Dockerfile (sin devDependencies,
#     usuario no root, imagen ~5x más liviana) en vez de "builder".
#   - Sin bind mounts de código — la imagen ya tiene el build compilado.
#   - Postgres NO publica ningún puerto al host — ni siquiera a 127.0.0.1.
#     Solo el propio backend, dentro de la red del compose, puede hablarle
#     (hallazgo de la auditoría, docs/dominio/09-auditoria-pentest.md §2).
#   - Caddy al frente: TLS automático (Let's Encrypt) + reverse proxy a
#     backend:3000. Es la única pieza que publica un puerto al exterior.
#
# POSTGRES_PASSWORD sale de un .env en la raíz del repo, en el VPS (nunca
# commiteado — ya cubierto por el .gitignore raíz). Mismo patrón que ya usa
# backend/.env para el resto de secretos (COOKIE_SECRET, LOGTO_APP_SECRET):
# archivo plano gitignored, sin añadir Docker secrets como mecanismo
# aparte solo para esta variable — coherencia > "más seguro en el papel".
# Debe ser EL MISMO valor que la contraseña dentro de DATABASE_URL en
# backend/.env — no hay nada que las sincronice automáticamente.
#
# Uso en el VPS:
#   cp backend/.env.example backend/.env   # y rellenar con secretos reales
#   echo "POSTGRES_PASSWORD=<mismo valor que en backend/.env>" > .env
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec backend npx prisma migrate deploy

services:
  postgres:
    image: postgres:16-alpine
    container_name: aeis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?debes definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: aeis_app
    volumes:
      - aeis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeis -d aeis_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin "ports:" — solo alcanzable desde otros servicios de este compose.

  backend:
    build:
      context: ./backend
      target: runtime
    container_name: aeis-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Bolsa de empleo: dónde viven los scrapers (Bolsa EPN, Indeed,
      # LinkedIn, Multitrabajos, Computrabajo). Es el nombre del servicio
      # del compose, no una URL pública — el contenedor no es alcanzable
      # desde fuera de esta red. Si se quita esta variable, el módulo de
      # empleos sigue funcionando solo con las APIs públicas
      # (ver ScraperSource: la fuente se desactiva sola).
      JOBS_SCRAPER_URL: http://jobs-scraper:8000
    expose:
      - "3000"
    # Tampoco publica "ports:" al host — solo Caddy le habla, por la red
    # interna del compose. Nadie externo llega a :3000 directamente.

  # Scrapers de ofertas de empleo (Python). Alimenta el módulo de bolsa de
  # empleo que reemplazó a Emprendimientos en el menú de la app.
  #
  # Cinco fuentes: la Bolsa EPN, Multitrabajos y Computrabajo con scrapers
  # propios sobre Playwright (ninguna tiene API pública, y son justo las que
  # publican pasantías para estudiantes de la EPN), más Indeed Ecuador y
  # LinkedIn vía JobSpy. Portado del worker Panchito GPT.
  #
  # Igual que postgres: SIN "ports:". Solo el backend le habla, por la red
  # interna. Un scraper es de las últimas piezas que conviene exponer a
  # internet — no tiene autenticación propia justamente porque nadie de
  # afuera puede alcanzarlo.
  jobs-scraper:
    build:
      context: ./jobs-scraper
    container_name: aeis-jobs-scraper
    restart: unless-stopped
    expose:
      - "8000"
    # Límite de memoria explícito: corre hasta dos Chromium a la vez
    # (Playwright) más pandas, y este VPS tiene 12 GB compartidos entre
    # Postgres, Logto, el backend y Caddy. Es preferible que el scraper
    # muera solo y se reinicie a que el OOM killer del kernel elija a
    # Postgres.
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      # start_period generoso: la primera importación arrastra pandas y
      # Playwright, y tarda varios segundos; sin esto el contenedor entraba
      # en bucle de reinicios antes de terminar de arrancar.
      start_period: 40s

  # Logto self-hosted (docs/dominio/02-necesidades-stakeholders.md §4.5,
  # decisión: self-hosted, no Logto Cloud). Usa el MISMO Postgres que el
  # backend, en una base de datos separada ("logto") — no se comparte
  # esquema con aeis_app. Esa base NO se crea sola: la primera vez hay que
  # correr, en la instancia:
  #   docker compose -f docker-compose.prod.yml exec postgres \
  #     psql -U aeis -c "CREATE DATABASE logto"
  # (el init-script automático de la imagen de Postgres solo corre en un
  # volumen nuevo, y aeis-postgres-data ya existe en producción).
  #
  # Dos hostnames porque Logto sirve dos apps distintas en dos puertos:
  # ENDPOINT (3001) es lo que ve el estudiante (páginas de login) y lo que
  # el backend usa como LOGTO_ISSUER; ADMIN_ENDPOINT (3002) es la consola
  # de administración donde se configura la app, el API resource y el
  # conector de GitHub — ver Caddyfile.
  logto:
    # Versión FIJA, no "latest". Con "latest", un `docker compose pull` en
    # cualquier momento podía saltar de versión sin que nadie lo decidiera
    # — y Logto es el proveedor de identidad: si un cambio suyo rompe el
    # login, nadie entra a la app y no queda registro de qué cambió ni
    # cuándo. Subir de versión ahora es editar esta línea, que es un
    # commit revisable y reversible.
    #
    # Al subir de versión, Logto corre sus propias migraciones sobre la
    # base "logto" — hacer respaldo ANTES (pg_dump de esa base), igual que
    # con cualquier migración de aeis_app.
    image: svhd/logto:1.43.0
    container_name: aeis-logto
    restart: unless-stopped
    environment:
      TRUST_PROXY_HEADER: "1"
      DB_URL: postgresql://aeis:${POSTGRES_PASSWORD:?}@postgres:5432/logto
      ENDPOINT: https://auth.aeis-app.online
      ADMIN_ENDPOINT: https://admin.aeis-app.online
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
      - "3002"
    # Sin "ports:" tampoco — mismo criterio que backend/postgres, Caddy es
    # el único que le habla desde fuera de la red del compose.

  caddy:
    image: caddy:2-alpine
    container_name: aeis-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # ":Z" relabela el archivo para SELinux (Oracle Linux 9 corre con
      # SELinux Enforcing) — sin esto, Caddy no puede leer el bind mount
      # y falla con "permission denied" aunque los permisos Unix esten bien.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ./panel-dist:/srv/panel:ro,Z
      - aeis-caddy-data:/data
      - aeis-caddy-config:/config
    depends_on:
      - backend
      - logto

volumes:
  aeis-postgres-data:
  aeis-caddy-data:
  aeis-caddy-config:
